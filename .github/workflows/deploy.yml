name: CI and production deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '154.12.117.217 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEkn4CA9QBAAvYvPOmFldqNLtPUQ3++DUZungNj3XKx7' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy exact image
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          REVISION: ${{ github.sha }}
        run: |
          token_b64="$(printf '%s' "$GHCR_TOKEN" | base64 -w0)"
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "printf '%s' '$token_b64' | base64 -d | docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null && cd /opt/auctor && git fetch origin '$REVISION' && git checkout --detach --force '$REVISION' && bash scripts/deploy-production.sh '$REVISION' '$IMAGE'"
      - name: Smoke public authentication gateway
        env:
          AUCTOR_PUBLIC_URL: https://auctor.space
        run: node scripts/smoke-auth-gateway.mjs
